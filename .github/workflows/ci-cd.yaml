name: CineDex DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic prometheus-fastapi-instrumentator

    - name: Smoke Test Backend
      run: |
        python -c "import main; print('FastAPI imported successfully')"

    - name: Build Container Check
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: cinedex-api:test
